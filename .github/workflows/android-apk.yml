name: Compilar APK DaniM Auto Warp

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "test-rc*.py"
      - "tests/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar configuración de RC124
        run: python3 test-rc124-ui.py

      - name: Compilar APK debug y ejecutar pruebas unitarias JVM
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest

      - name: Publicar APK descargable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DaniMAutoWarp-RC124-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DaniMAutoWarp-RC124-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
